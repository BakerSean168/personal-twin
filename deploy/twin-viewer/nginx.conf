server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok
";
    }

    location /assets/ {
        add_header Cache-Control "private, max-age=60";
        try_files $uri =404;
    }

    location = /assets/manifest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/seated-v1-report.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/body-summary.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/room.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/avatar-standing.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/room-integration.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/scene-combined.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /assets/workstation-analysis.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /app.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /styles.css {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /vendor/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
