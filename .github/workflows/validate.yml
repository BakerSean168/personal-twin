name: Validate schemas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_json.py
      - run: python -m py_compile scripts/body/body_model.py
      - run: bash -n scripts/body/body-model.sh
      - run: python -m py_compile scripts/ergonomics/seated_blender.py scripts/ergonomics/validate_setup.py
      - run: bash -n scripts/ergonomics/seated-scene.sh
