name: Validate schemas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_json.py
      - run: python -m py_compile scripts/body/body_model.py
      - run: bash -n scripts/body/body-model.sh
      - run: python -m py_compile scripts/ergonomics/seated_blender.py scripts/ergonomics/validate_setup.py
      - run: bash -n scripts/ergonomics/seated-scene.sh
      - run: python -m py_compile scripts/viewer/export_standing_blender.py scripts/viewer/convert_room_blender.py scripts/viewer/build_cutaway_blender.py
      - run: python -m py_compile scripts/integration/build_room_transform.py scripts/integration/build_combined_blender.py
      - run: python -m py_compile scripts/analysis/workstation_ergonomics.py
      - run: bash -n scripts/viewer/build-assets.sh scripts/viewer/browser-smoke.sh
      - run: node --input-type=module --check < deploy/twin-viewer/html/app.js
